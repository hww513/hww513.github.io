ionWarning\":true,\"dangerouslySetInnerHTML\":{\"__html\":\"\\n              @keyframes gradientMove { \\n                0% { background-position: 0% 50%; } \\n                50% { background-position: 100% 50%; } \\n                100% { background-position: 0% 50%; } \\n              }\\n            \"}}]\n11:[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L8\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L9\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}]\n"])</script><script>self.__next_f.push([1,"12:[\"$\",\"$1\",\"c\",{\"children\":[[\"$\",\"$L1e\",null,{\"posts\":[{\"id\":\"being-alone\",\"slug\":\"being-alone\",\"title\":\"一个人的时候\",\"type\":\"post\",\"date\":\"2026-10-02 09:00:00\",\"cover\":\"/images/cover-being-alone.jpg\",\"content\":\"我以前分不清\\\"独处\\\"和\\\"孤独\\\"，觉得它们是一回事，都是没人陪，都不好。\\n\\n后来才明白，它们的区别在于：**独处是你在场，孤独是你不在场。**\\n\\n一个人吃饭，如果全程在看视频，那不算独处，只是把别人的声音当成背景音，用来盖住\\\"只有我一个人\\\"这件事。真正的独处是关掉视频，慢慢吃完那顿饭，尝到味道，然后想一点自己的事。\\n\\n我花了很久才做到后者。最开始一个人待着会难受，那种难受没有具体原因，就是坐不住，想找点事做，想找个人说话。后来我发现，那种坐不住的本质，是**害怕安静下来之后浮上来的东西**——没处理完的情绪、不想面对的问题、还有一些关于自己的、不太好听的结论。\\n\\n所以独处其实是一项能力，而且需要练。\\n\\n我现在的练法很笨：每天留二十分钟，不带手机，就在附近走走。一开始脑子里全是待办事项，走到第八分钟才安静下来。安静下来之后，那些平时被噪音盖住的想法才浮出来。有时候是很久没想起的人，有时候是一件当时没在意、现在回头看很关键的小事。\\n\\n这些想法没有用，不能变现，不能写进简历。但它们让我感觉自己是一个连续的人，而不是一堆被日程推着走的碎片。\\n\\n前段时间看到一句话，大意是：人跟自己相处的方式，会慢慢变成他跟世界相处的方式。如果一个人不能忍受独处，那他大概率也不能忍受很多别的——不能忍受沉默，不能忍受不同意见，不能忍受事情没有立刻得到回应。\\n\\n反过来，能好好跟自己待着的人，好像都松弛一些。\\n\\n我还在练。目前最好的状态是：晚上散步回来，什么都没想清楚，但心里安静了不少。这样就够了。\"},{\"id\":\"farewell\",\"slug\":\"farewell\",\"title\":\"告别这件事\",\"type\":\"post\",\"date\":\"2026-09-30 09:00:00\",\"cover\":\"/images/cover-farewell.jpg\",\"content\":\"我认真想过的告别，只有寥寥几次。剩下的，都是后来才发现已经结束了。\\n\\n小学最好的朋友，转学那天我们交换了地址，说好要写信。信写了两封，第三封没写完，就搁下了。再后来我连他长什么样都记不清。这不是谁的错，只是没有人宣布这件事到此为止。\\n\\n高中一起吃饭的三个人，毕业照上还挨着站。现在一个在群里从不说话，一个只在过年发祝福，另一个我们互相点赞但从没聊过。没有任何一件事让我们不愉快。只是各走各的，路岔开了，再没有走回来。\\n\\n我一度为此难过，觉得是不是自己不够珍惜。后来慢慢接受了：**大部分关系的结束不是断裂，是稀释。** 它不发生在一个具体的时刻，而是发生在很多个\\\"下次再说\\\"里。\\n\\n真正有仪式的告别反而好过。大学毕业那天大家抱在一起哭，把所有话都说完了，之后天各一方也心安。因为那件事有了一个明确的句号，你知道自己站在句号后面，可以往前走了。\\n\\n难的是没有句号的那些。你会在某个深夜突然想起某个人，翻聊天记录翻到一半，发现最后一条是两年前的\\\"好的\\\"。你甚至不知道该不该发一句\\\"最近怎么样\\\"。发了怕突兀，不发又觉得好像欠着什么。\\n\\n我现在的做法是：想发就发。不去想会不会显得奇怪，不去算这中间隔了多久。因为如果连这个都要反复权衡，那这段关系在我这边早就已经不自然了。\\n\\n至于那些真的走散了的，我学着把它们当成书架上没读完的书。不遗憾，只是知道它在那儿。偶尔想起来，还挺好的。\"},{\"id\":\"on-time\",\"slug\":\"on-time\",\"title\":\"时间是有质地的\",\"type\":\"post\",\"date\":\"2026-09-24 09:00:00\",\"cover\":\"/images/cover-on-time.jpg\",\"content\":\"小时候以为时间是均匀的。上课的四十五分钟和课间的十分钟，数字差得远，感受却完全反过来——上课像一整个下午，课间像眨了一下眼。那时候我把这归咎于自己不爱学习。\\n\\n后来发现，大人也一样。\\n\\n等一个消息的下午会漫长得可怕。同一段时间，如果埋头在做一件顺手的事，抬头天就黑了。日历上的格子是等宽的，装进去的东西却轻重不一。\\n\\n我开始留意那些\\\"过得快\\\"的时刻，想找出共同点。结果并不浪漫：不是快乐的时候过得快，而是**注意力被占满的时候过得快**。痛苦如果足够具体，也能让时间飞起来——赶一个截止日期，处理一件必须马上解决的麻烦，都是这样。\\n\\n真正难熬的是另一种：注意力缺席的时候。人坐在那里，心不在，时间就变得黏稠，一分钟要走上很久。刷手机的时候尤其明显——不是无聊，是时间被切成了很多小段，每一段都不算数。\\n\\n所以\\\"浪费时间\\\"这个说法其实不准。时间不会因为你没干活就变慢，它只是变得没有形状，事后回想起来一片空白。真正被浪费掉的不是那段时间，是那段时间里的自己。\\n\\n我现在会刻意找一些\\\"有形状\\\"的事做：洗碗、走路、把一件事从头写到尾。它们不产出什么，但过完之后，那一段是能被记住的。\\n\\n时间大概不是一条线，而是一块布。织得密的地方结实，稀的地方一拉就破。我们能决定的，其实只是这一块织得密不密。\"},{\"id\":\"reflections\",\"slug\":\"reflections\",\"title\":\"些许感慨\",\"type\":\"post\",\"date\":\"2026-09-27 10:00:00\",\"cover\":\"/images/cover-reflections.jpg\",\"content\":\"或许宇宙的本质就在于其不可知性，这种未知既是一种束缚也是一种解放。它让我们意识到，即使是在一个可能早已超出我们理解范畴的宏大结构中，我们的存在也依然有着独特的意义。宇宙的浩瀚与生命的渺小形成了鲜明对比，但正是这种对比赋予了我们存在的价值。\\n\\n有人认为，\\\"人生如梦，一场游戏一场空\\\" 也有人坚持，\\\"我命由我不由天，逆天改命又何妨\\\" 还有人选择，\\\"平淡是真，平凡是福\\\" 更有父母期盼，\\\"望子成龙，望女成凤\\\"\\n\\n我认为，不论身处何种境地，对于宇宙的思索、对于存在的探讨，并非是要我们每个人都成为科学家或哲学家，而是要让我们学会珍惜眼前的一切，学会在有限的生命里寻找无限的意义。\\n\\n\\\"人的一生，或如流星划过天际，或似恒星静静守候\\\" 也许我只是一颗微不足道的小行星，在浩瀚的宇宙中默默运行，不会引起太多注意，也不会留下太多痕迹，\\n\\n但即便如此，我也要在自己的轨道上发光发热，即使光芒微弱，也要照亮一段路程，让那些偶然经过的人感受到一丝温暖。\\n\\n\\\"如何度过一生，这是一个值得思考的问题。\\\" 这个问题就如同探索宇宙的奥秘一般深邃。我尚未找到完全满意的答案，只能说：我希望我的人生，可以充满探索，不要失去好奇之心。\"},{\"id\":\"small-things\",\"slug\":\"small-things\",\"title\":\"微小的事\",\"type\":\"post\",\"date\":\"2026-09-27 09:00:00\",\"cover\":\"/images/cover-small-things.jpg\",\"content\":\"我一直以为人是被大事塑造的：升学、工作、搬家、告别。所以有很长一段时间，我瞧不上\\\"小事\\\"，觉得它们只是填充物，是两件大事之间的空白。\\n\\n后来发现完全反了。\\n\\n真正撑住我的，全是些说不出口的小事。\\n\\n早上出门前把杯子洗干净放回原位；回家路上拐进便利店买一瓶冰的；睡前把第二天要穿的衣服搭在椅背上。这些事单拎出来都毫无意义，谁也不会因为做了一件就变得更好。\\n\\n但它们加起来，构成了一种\\\"我在正常地过日子\\\"的证据。日子乱掉的时候，最先消失的就是这些——杯子堆在水槽里，衣服扔在地上，回家路上什么都不想买。不是懒，是那根线断了。\\n\\n我有个朋友经历过一段很糟的时期。他说那段时间他唯一坚持的事，是每天把被子叠好。不是因为叠被子重要，而是因为\\\"至少有一件事是我自己决定的\\\"。\\n\\n这句话我记了很久。\\n\\n大事我们其实控制不了多少。offer 来不来，人来不来，机会什么时候出现——都悬在别人和运气手里。但晚饭吃什么、今天走哪条路回家、要不要把桌面收拾一下，这些完全由自己说了算。\\n\\n所以我现在的判断标准变了：如果一个人还愿意给自己煮一顿饭，还愿意把鞋摆整齐，那他大概率没事。反过来，如果连这些都不做了，那才是真的警报。\\n\\n大事决定你去哪，小事决定你还是不是你。\"}],\"chatters\":[],\"moments\":[]}],[\"$L1f\",\"$L20\",\"$L21\",\"$L22\"],\"$L23\"]}]\n"])</script><script>self.__next_f.push([1,"24:[]\n13:\"$W24\"\n14:[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$L25\",null,{\"children\":\"$L26\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$L27\",null,{\"children\":[\"$\",\"$28\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L29\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}]\n16:[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/145o.lsi86g0w.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n17:[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/066jf0nk75nic.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n18:[\"$\",\"link\",\"2\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/0fyvyei8xfpn0.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n19:[\"$\",\"link\",\"3\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/05qgpfpodee_o.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n"])</script><script>self.__next_f
